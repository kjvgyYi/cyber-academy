id: quiz-0-3
title: Проверка — терминал
lesson: "0.3"
module: 0
questions:
  - q: Команда pwd показывает…
    options:
      - Список файлов
      - Текущую рабочую папку
      - Пароль пользователя
      - Права доступа
    answer: 1
    explanation: pwd (print working directory) выводит абсолютный путь папки, в которой ты находишься.
  - q: Чем абсолютный путь отличается от относительного?
    options:
      - Абсолютный начинается с /, относительный — от текущей папки
      - Абсолютный короче
      - Относительный всегда начинается с /
      - Разницы нет
    answer: 0
    explanation: Абсолютный путь (/var/log/auth.log) отсчитывается от корня, относительный (log/auth.log) — от текущей папки.
  - q: Что делает ls -la?
    options:
      - Удаляет файлы
      - Показывает список подробно, включая скрытые файлы
      - Создаёт папку
      - Логинит пользователя
    answer: 1
    explanation: Флаг -l даёт подробный вывод, -a показывает скрытые файлы (начинающиеся с точки).
  - q: Как обновить списки пакетов в Kali?
    options:
      - sudo apt upgrade
      - sudo apt update
      - sudo apt remove
      - apt list
    answer: 1
    explanation: apt update синхронизирует списки доступных версий с репозиториями; apt upgrade затем ставит новые версии пакетов.
