id: quiz-0-1
title: Проверка — основы и закон
lesson: "0.1"
module: 0
questions:
  - q: Что защищает буква «I» (Integrity) в триаде CIA?
    options:
      - Что данные не прочитают посторонние
      - Что данные никто не изменил незаметно
      - Что система всегда доступна
      - Что пользователь ввёл верный пароль
    answer: 1
    explanation: "Integrity — целостность: гарантия, что данные не были изменены неавторизованно. Пример нарушения — подмена номера счёта в письме."
  - q: Nmap-скан чужого сервера без разрешения. Это…
    options:
      - Легально, ведь Nmap — обычный инструмент
      - Легально, если ничего не сломать
      - Потенциально нарушение — нет разрешения на эту систему
      - Легально только ночью
    answer: 2
    explanation: Разрешение важнее инструмента. Скан чужой системы без согласия может подпадать под §202a StGB независимо от того, «сломал» ты что-то или нет.
  - q: Какой параграф StGB в Германии касается именно подготовки (например, средств доступа) к несанкционированному доступу к данным?
    options:
      - §202a
      - §202c
      - §303a
      - §303b
    answer: 1
    explanation: §202c — Vorbereiten des Ausspähens… — подготовка к §202a/b. §202a — сам доступ, §303a/b — изменение данных и саботаж.
  - q: Что из этого — легальная тренировочная площадка?
    options:
      - Сайт соседней фирмы «на пробу»
      - Wi-Fi соседа
      - Машина на Hack The Box
      - Любой сайт с формой логина
    answer: 2
    explanation: Учебные платформы (Hack The Box, TryHackMe, CTF) дают разрешение в рамках своих правил. Остальное — чужие системы без согласия.
  - q: Большинство рабочих мест в cybersecurity относятся к…
    options:
      - Только к взлому (Red Team)
      - К защите, инженерии и GRC (не только к атаке)
      - К написанию вирусов
      - К игре в CTF
    answer: 1
    explanation: Blue Team, Security Engineering и GRC составляют бóльшую часть индустрии. Cybersecurity намного шире, чем «хакинг».
