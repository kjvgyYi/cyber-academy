id: quiz-0-5
title: Проверка — Docker и веб-цель
lesson: "0.5"
module: 0
questions:
  - q: Ключевое отличие контейнера от виртуальной машины?
    options:
      - Контейнер эмулирует целую ОС
      - Контейнер запускает приложение, используя ядро хоста; VM несёт целую ОС
      - Контейнер тяжелее VM
      - Разницы нет
    answer: 1
    explanation: Контейнер изолирует приложение с зависимостями поверх ядра хоста — легко и быстро; VM эмулирует целый компьютер с отдельной ОС.
  - q: Что такое OWASP Juice Shop?
    options:
      - Антивирус
      - Намеренно уязвимое веб-приложение для обучения
      - Магазин соков
      - Файрвол
    answer: 1
    explanation: Juice Shop — учебный уязвимый интернет-магазин от OWASP, покрывающий OWASP Top 10.
  - q: Почему запускаем Juice Shop с -p 127.0.0.1:3000:3000?
    options:
      - Чтобы открыть его всей сети
      - Чтобы порт был доступен только с нашей машины
      - Чтобы ускорить контейнер
      - Это обязательный синтаксис Docker
    answer: 1
    explanation: Привязка к 127.0.0.1 держит порт на localhost — цель доступна только тебе, тренировка легальна и безопасна.
  - q: Что делает флаг --rm в docker run?
    options:
      - Запускает от root
      - Удаляет контейнер после остановки
      - Перезапускает Docker
      - Открывает порт
    answer: 1
    explanation: '--rm автоматически удаляет контейнер после завершения, не оставляя мусора.'
