id: quiz-0-4
title: Проверка — изоляция цели
lesson: "0.4"
module: 0
questions:
  - q: Почему Metasploitable нельзя подключать к интернету?
    options:
      - Она потребляет много трафика
      - Она намеренно уязвима и может быть скомпрометирована
      - Это запрещено лицензией
      - Она сломает роутер
    answer: 1
    explanation: Metasploitable дырявая по замыслу. В реальной сети её легко заразит кто угодно, поэтому держим её только в host-only.
  - q: Что позволяет host-only сеть?
    options:
      - Дать VM доступ в интернет
      - Связать VM между собой и с хостом без выхода в интернет
      - Ускорить сеть
      - Скрыть VM от хоста
    answer: 1
    explanation: Host-only соединяет VM и хост в закрытом сегменте без доступа в интернет — идеальная изолированная лаборатория.
  - q: Какие адаптеры логично дать Kali для стенда?
    options:
      - Только NAT
      - Host-only (к цели) и NAT (для обновлений)
      - Только Bridged
      - Никаких
    answer: 1
    explanation: Host-only даёт связь с целью, второй адаптер NAT — доступ в интернет для обновлений Kali.
  - q: Вывод ping показал «0% packet loss». Это значит…
    options:
      - Цель недоступна
      - Связь установлена, все пакеты дошли
      - Потеряно всё
      - Файрвол блокирует
    answer: 1
    explanation: 0% packet loss — все ICMP-пакеты вернулись, связь между Kali и целью работает.
