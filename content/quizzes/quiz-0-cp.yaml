id: quiz-0-cp
title: Checkpoint — итог модуля 0
lesson: "0.cp"
module: 0
questions:
  - q: Правильная схема изоляции учебного стенда?
    options:
      - Все VM в bridged, включая уязвимую цель
      - Уязвимая цель только в host-only, Kali — host-only + NAT
      - Всё в интернете для удобства
      - Только одна VM без сети
    answer: 1
    explanation: Уязвимая цель изолирована в host-only без интернета; Kali имеет host-only (к цели) и NAT (обновления). Тренировочный трафик замкнут внутри.
  - q: Что общего у Metasploitable и Juice Shop?
    options:
      - Оба антивирусы
      - Оба намеренно уязвимы и предназначены для легальной тренировки у тебя
      - Оба надо публиковать в интернет
      - Оба часть Windows
    answer: 1
    explanation: Обе цели специально уязвимы и запускаются только в изоляции (host-only / localhost) для легальной практики.
  - q: Друг предлагает выложить твой Juice Shop в интернет по белому IP. Верная реакция?
    options:
      - Согласиться, так удобнее
      - Отказаться: уязвимую цель нельзя публиковать; тренироваться удалённо — через VPN в свою лабораторию или на разрешённых платформах
      - Выложить, но ночью
      - Выложить только на выходные
    answer: 1
    explanation: Публикация уязвимой цели опасна (её взломают) и создаёт риски. Удалённо тренируются через VPN к своей лаборатории или на платформах вроде TryHackMe/HTB.
