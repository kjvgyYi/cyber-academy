id: quiz-0-6
title: Проверка — Git и GitHub
lesson: "0.6"
module: 0
questions:
  - q: Что такое Git?
    options:
      - Облачный хостинг
      - Система контроля версий, хранящая историю изменений
      - Текстовый редактор
      - Язык программирования
    answer: 1
    explanation: Git — система контроля версий; она ведёт историю изменений файлов локально. GitHub — облачный хостинг таких репозиториев.
  - q: Правильный порядок сохранения изменений?
    options:
      - git push → git add → git commit
      - git add → git commit → git push
      - git commit → git add → git push
      - git init → git push → git add
    answer: 1
    explanation: Сначала add (подготовить), потом commit (зафиксировать локально), потом push (отправить на GitHub).
  - q: Что НЕЛЬЗЯ коммитить в репозиторий?
    options:
      - Заметки в Markdown
      - Пароли и токены
      - README
      - Скрипты
    answer: 1
    explanation: Секреты (пароли, токены, ключи) в репозиторий не коммитят — используй .gitignore и храни секреты отдельно.
  - q: Зачем начинающему в ИБ вести публичный GitHub?
    options:
      - Это обязательно по закону
      - Как портфолио — доказательство навыков работодателю
      - Чтобы ускорить компьютер
      - Незачем
    answer: 1
    explanation: Публичные проекты на GitHub — прямое доказательство навыков при поиске Ausbildung или работы.
