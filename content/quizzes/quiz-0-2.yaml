id: quiz-0-2
title: Проверка — виртуализация
lesson: "0.2"
module: 0
questions:
  - q: Зачем учиться в виртуальной машине, а не в основной системе?
    options:
      - VM работает быстрее реального ПК
      - Изоляция, безопасность и возможность откатиться снапшотом
      - Это единственный способ запустить Linux
      - VM не требует ресурсов
    answer: 1
    explanation: VM даёт изоляцию от основной системы, безопасность при работе с мощными инструментами и снапшоты для отката.
  - q: Что делает снапшот VirtualBox?
    options:
      - Ускоряет виртуальную машину
      - Сохраняет состояние VM, чтобы к нему вернуться
      - Удаляет ненужные файлы
      - Публикует VM в интернет
    answer: 1
    explanation: Снапшот фиксирует состояние VM. После поломки можно откатиться к «clean-install» за секунды.
  - q: Команда systemd-detect-virt вернула «oracle». Что это значит?
    options:
      - Установлена база данных Oracle
      - Система работает в VirtualBox
      - Обнаружена уязвимость
      - Нет виртуализации
    answer: 1
    explanation: '«oracle» указывает на VirtualBox (Oracle VM) — подтверждение, что ты внутри изолированной виртуальной машины.'
  - q: Сколько ресурсов разумно выделить учебной Kali на ПК с 16 ГБ RAM?
    options:
      - Всю память и все ядра
      - Примерно 2 ядра и 4 ГБ
      - 1 ГБ, больше не нужно никогда
      - Ровно половину диска под RAM
    answer: 1
    explanation: 2 ядра и 4 ГБ достаточно для учёбы и не роняют производительность хоста.
