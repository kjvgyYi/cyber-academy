title: "Карманный Хакер: Cybersecurity Academy"
subtitle: "Роадмап от нуля до практикующего специалиста — 18 месяцев"

phases:
  - number: 1
    title: Фундамент
    months: "1–3"
  - number: 2
    title: Offensive Basics
    months: "4–6"
  - number: 3
    title: Defensive Basics
    months: "7–9"
  - number: 4
    title: Специализация
    months: "10–12"
  - number: 5
    title: Практика и карьера
    months: "13–18"

modules:
  - number: 0
    title: Введение и setup лабы
    summary: "Цели курса, границы закона, сборка изолированного учебного стенда на VirtualBox + Kali + Metasploitable."
    phase: 1
  - number: 1
    title: Компьютерные сети
    summary: "TCP/IP стек, ARP, DNS, NAT, маршрутизация — глазами защитника и атакующего. Wireshark как основной инструмент анализа."
    phase: 1
  - number: 2
    title: "Операционные системы: Linux"
    summary: "Файловая система, процессы, пользователи, права, логи — всё что нужно для работы в терминале и понимания атак."
    phase: 1
  - number: 3
    title: "Операционные системы: Windows"
    summary: "Реестр, Active Directory, PowerShell, Event Log — среда в которой работает большинство корпоративных целей."
    phase: 1
  - number: 4
    title: Криптография
    summary: "Симметричная и асимметричная криптография, хеши, TLS, PKI — фундамент для понимания любого защитного механизма."
    phase: 1
  - number: 5
    title: Разведка и сканирование
    summary: "OSINT-методология, nmap, Nessus/OpenVAS, Google Dorks — сбор информации до первого подключения к цели."
    phase: 2
  - number: 6
    title: Веб-уязвимости
    summary: "SQLi, XSS, CSRF, IDOR, Path Traversal, SSRF, XXE — OWASP Top 10 с примерами эксплуатации на учебных стендах."
    phase: 2
  - number: 7
    title: Инструменты атаки
    summary: "Burp Suite, SQLMap, ffuf, gobuster — профессиональный инструментарий для ручного и автоматизированного тестирования."
    phase: 2
  - number: 8
    title: Эксплуатация систем
    summary: "Reverse shells, privilege escalation Linux/Windows, lateral movement — от точки входа до полного контроля."
    phase: 2
  - number: 9
    title: Hardening систем
    summary: "CIS Benchmarks, настройка firewall, SSH ключи, SELinux/AppArmor — снижение attack surface на уровне ОС."
    phase: 3
  - number: 10
    title: Мониторинг и SIEM
    summary: "ELK Stack, Wazuh, Snort, Suricata — сбор, нормализация и корреляция событий безопасности."
    phase: 3
  - number: 11
    title: Incident Response
    summary: "NIST фазы, forensics, Volatility, Autopsy — методология реагирования на инциденты и цифровая криминалистика."
    phase: 3
  - number: 12
    title: Blue Team инструменты
    summary: "Sysmon, YARA, TheHive, VirusTotal — инструментарий защитника для обнаружения и анализа угроз."
    phase: 3
  - number: 13
    title: Reverse Engineering
    summary: "x86/x64 архитектура, GDB, Ghidra, crackme — дизассемблирование и анализ бинарных файлов."
    phase: 4
  - number: 14
    title: Exploit Development
    summary: "Buffer overflow, shellcode, ROP-цепочки, обход ASLR/DEP — разработка эксплойтов от теории до рабочего PoC."
    phase: 4
  - number: 15
    title: Malware Analysis
    summary: "Статический и динамический анализ, PE/ELF форматы, C2-механизмы, песочницы — понимание как работает malware."
    phase: 4
  - number: 16
    title: Red Team Operations
    summary: "MITRE ATT&CK, C2-фреймворки, evasion техники, OPSEC — имитация реального атакующего в рамках авторизованных операций."
    phase: 4
  - number: 17
    title: Cloud Security
    summary: "AWS/Azure/GCP IAM, мисконфигурации, S3 buckets, контейнеры — безопасность облачной инфраструктуры."
    phase: 4
  - number: 18
    title: "CTF — соревнования"
    summary: "Jeopardy и Attack-Defense форматы, платформы, стратегии решения заданий, написание write-up'ов."
    phase: 5
  - number: 19
    title: Bug Bounty
    summary: "HackerOne, Bugcrowd, методология поиска, правила отчётности — монетизация навыков через легальный поиск уязвимостей."
    phase: 5
  - number: 20
    title: Домашняя лаборатория
    summary: "VirtualBox/Proxmox, Kali, pfSense, Security Onion — полноценный учебный стенд для всех этапов роадмапа."
    phase: 5
  - number: 21
    title: Карьера в кибербезе
    summary: "Роли и зарплаты, OSCP/CEH/CISSP/CompTIA, резюме и LinkedIn, путь от junior до senior."
    phase: 5
