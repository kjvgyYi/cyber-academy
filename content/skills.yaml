- id: python
  name: Python
  target: 3
  description: Программирование на Python — от синтаксиса до собственных утилит безопасности.
  levels:
    - Читаю простой код, запускаю скрипты, понимаю переменные и типы.
    - Пишу функции, работаю со структурами данных и файлами, обрабатываю ошибки.
    - Собираю рабочие утилиты (сканер, парсер логов) с requests, сокетами и API.
  evidence:
    - Модули 5, 11–14
    - Проекты Security Log Analyzer, Port Scanner

- id: linux
  name: Linux
  target: 3
  description: "Уверенная работа в Linux: файловая система, права, процессы, пакеты."
  levels:
    - Ориентируюсь в файловой системе, базовые команды навигации.
    - Управляю правами, пользователями, процессами и пакетами.
    - Настраиваю систему, читаю логи, отлаживаю проблемы окружения.
  evidence:
    - Модуль 2
    - Проект Linux System Inspector

- id: kali
  name: Kali Linux
  target: 2
  description: Работа в Kali и её инструментах на изолированном стенде.
  levels:
    - Установил Kali, ориентируюсь в наборе инструментов.
    - Применяю ключевые инструменты в лаборатории по методологии.
  evidence:
    - Модули 6–7
    - Лаборатории по сканированию

- id: networking
  name: Networking
  target: 3
  description: "Понимание сетей: TCP/IP, порты, протоколы — глазами защитника и атакующего."
  levels:
    - Знаю модель OSI, IP, порты, основные протоколы.
    - Читаю трафик, понимаю рукопожатия, DNS и HTTP на уровне пакетов.
    - Анализирую аномалии в трафике, связываю сетевые события с атаками.
  evidence:
    - Модули 3, 8
    - Лаборатории с Wireshark

- id: cybersecurity
  name: Cybersecurity
  target: 3
  description: Базовые концепции ИБ, модели угроз, роли, жизненный цикл инцидента.
  levels:
    - Понимаю CIA, направления, границы закона.
    - Разбираю модели угроз и типы атак, читаю разбор инцидента.
    - Связываю практику (разведка, эксплуатация, защита) в единую картину.
  evidence:
    - Модули 0–1, 9, 16
    - Security Challenges

- id: automation
  name: Automation
  target: 3
  description: Автоматизация рутины безопасности собственными скриптами.
  levels:
    - Пишу простые скрипты под конкретную задачу.
    - Автоматизирую разбор логов и разведку, формирую отчёты.
    - Собираю переиспользуемые инструменты с конфигом и уведомлениями.
  evidence:
    - Модули 11–14
    - Проекты File Integrity Monitor, Security Log Analyzer

- id: bash
  name: Bash
  target: 2
  description: Командная строка и bash-скрипты для быстрого анализа и автоматизации.
  levels:
    - Использую пайпы, grep, перенаправление вывода.
    - Пишу bash-скрипты с условиями, циклами и обработкой аргументов.
  evidence:
    - Модуль 4
    - Лаборатории по анализу логов

- id: web-security
  name: Web Security
  target: 3
  description: "Безопасность веб-приложений: HTTP, OWASP Top 10, инструменты."
  levels:
    - Понимаю устройство HTTP-запросов и ответов.
    - Нахожу типовые уязвимости OWASP на учебном стенде.
    - Провожу разбор и эксплуатацию уязвимостей на Juice Shop с Burp.
  evidence:
    - Модуль 9
    - Web Security Labs

- id: crypto
  name: Cryptography
  target: 2
  description: "Прикладная криптография: хеши, симметрия/асимметрия, TLS."
  levels:
    - Понимаю разницу хеша, симметричного и асимметричного шифрования.
    - Применяю библиотеку cryptography и разбираю TLS на практике.
  evidence:
    - Модули 10, 15

- id: log-analysis
  name: Log Analysis
  target: 2
  description: Чтение и анализ логов для обнаружения атак.
  levels:
    - Читаю системные логи, нахожу подозрительные записи вручную.
    - Автоматизирую разбор логов и выделяю индикаторы компрометации.
  evidence:
    - Модули 12, 14
    - Проект Security Log Analyzer

- id: pentest
  name: Pentesting
  target: 2
  description: Методология и этика тестирования на проникновение на стенде.
  levels:
    - Знаю фазы пентеста и правила легальной работы.
    - Прохожу полный цикл на учебной цели с отчётом.
  evidence:
    - Модуль 16
    - Capstone
