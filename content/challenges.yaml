- id: chal-01
  number: 1
  title: Легально или нет?
  difficulty: beginner
  skills: [cybersecurity]
  unlockAfter: "0.1"
  scenario: |
    Разбери пять ситуаций и для каждой реши: легально действие или нет, и какой принцип
    (или параграф StGB) применим.

    1. Ты сканируешь Nmap'ом свою Kali VM.
    2. Сосед оставил открытый Wi-Fi, ты подключился «просто посмотреть».
    3. На CTF-платформе ты эксплуатируешь предложенную машину.
    4. Ты нашёл на школьном сайте IDOR и перебрал 200 чужих id.
    5. Ты скачал Hashcat, но пока ничего им не делал.
  questions:
    - Какие пункты легальны, а какие нет?
    - Где ключевую роль играет «разрешение», а не сам инструмент?
    - Какой параграф StGB применим к пунктам 2 и 4?
  hints:
    - К каждому пункту задай один вопрос — есть ли разрешение на эту конкретную систему.
    - Обладание инструментом и его применение — разные вещи.
  solution: |
    Легальны: 1 (своё), 3 (платформа даёт разрешение), 5 (обладание инструментом законно).
    Нелегальны: 2 и 4 — доступ к чужим системам без разрешения, подпадает под §202a.
    Принцип: разрешение важнее инструмента.

- id: chal-02
  number: 2
  title: Спроектируй изоляцию
  difficulty: beginner
  skills: [networking, cybersecurity]
  unlockAfter: "0.4"
  scenario: |
    Тебе нужно добавить в лабораторию вторую уязвимую цель (веб-сервер) так, чтобы
    Kali её видела, но она не имела доступа в интернет и не мешала Metasploitable.
  questions:
    - Какой тип сетевого адаптера дать новой цели?
    - Как проверить, что новая цель изолирована от интернета?
    - Нужно ли что-то менять на Kali?
  hints:
    - Вспомни разницу NAT и host-only.
  solution: |
    Новой цели — host-only адаптер в той же сети 192.168.56.0/24. Проверка изоляции:
    `ping 8.8.8.8` с цели не должен проходить. Kali уже имеет host-only, менять ничего не нужно —
    она увидит новую цель автоматически.

- id: chal-03
  number: 3
  title: Responsible Disclosure
  difficulty: beginner
  skills: [cybersecurity]
  unlockAfter: "0.1"
  scenario: |
    На сайте немецкой компании по адресу /backup/ открыт листинг файлов, среди них customers.sql.
    Bug bounty программы нет.
  questions:
    - Можно ли скачать файл «чтобы доказать проблему»?
    - Каков корректный путь сообщить о находке?
    - Какая часть триады CIA под угрозой?
  hints:
    - Скачивание чужих данных — уже доступ, даже с добрым мотивом.
    - Поищи Coordinated Vulnerability Disclosure и роль BSI/CERT.
  solution: |
    Скачивать нельзя — это доступ к чужим данным (§202a), мотив не оправдывает. Корректно:
    зафиксировать факт (URL, скриншот без скачивания данных), сообщить владельцу/через security-контакт
    или CERT, не распространять. Под угрозой конфиденциальность (Confidentiality).
