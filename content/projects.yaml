- id: lab-setup
  title: Lab Setup — воспроизводимый стенд
  module: 0
  summary: Задокументированная изолированная лаборатория, которую можно поднять заново.
  description: |
    Первый проект — не код, а **инфраструктура и документация**. Цель: собрать
    лабораторию так, чтобы через месяц (или на другом ПК) ты мог воспроизвести её
    по своим заметкам, и чтобы любой, кто их прочитает, понял принцип изоляции.

    Это фундамент для всех следующих модулей и первый репозиторий в портфолио.
  requirements:
    - Kali Linux в VirtualBox со снапшотом «clean-install».
    - Metasploitable 2 в host-only сети, изолированная от интернета.
    - Docker с OWASP Juice Shop на localhost.
    - Репозиторий cyber-course на GitHub с заметками.
  skills:
    - cybersecurity
    - linux
    - kali
  prerequisites:
    - Уроки 0.1–0.6 пройдены.
  tasks:
    - id: proj-lab-diagram
      title: Схема сети
      input: false
      prompt: |
        Опиши (текстом или ASCII-схемой) топологию стенда: какие VM, какие адаптеры,
        какие IP в host-only сети, куда есть и куда нет доступа в интернет.
      hints:
        - 'Формат: Kali (host-only 192.168.56.x + NAT) ↔ Metasploitable (host-only, изолирована).'
    - id: proj-lab-readme
      title: README стенда
      input: false
      prompt: |
        Напиши README.md: как поднять стенд с нуля, какие образы качать, какие
        команды выполнять, как проверить связь и изоляцию.
      hints:
        - Представь, что читатель — ты через полгода. Пиши так, чтобы шаги повторялись без догадок.
    - id: proj-lab-verify
      title: Проверка изоляции
      input: false
      prompt: |
        Задокументируй две проверки: (1) Kali пингует цель — `0% packet loss`;
        (2) цель НЕ пингует 8.8.8.8 — изоляция работает. Вставь вывод команд.
  expectedResult: |
    Публичный репозиторий `cyber-course` с папкой `module-0`, содержащей `lab-setup.md`
    (схема + инструкция) и подтверждение проверок изоляции. Стенд воспроизводим по документации.
  checklist:
    - Схема сети понятна и отражает host-only изоляцию.
    - README позволяет поднять стенд с нуля без дополнительных вопросов.
    - Показаны проверки связи и изоляции с реальным выводом команд.
    - Репозиторий запушен на GitHub, секреты не закоммичены.
  readmeTemplate: |
    # Cyber Course — Lab Setup

    Изолированная учебная лаборатория для курса Python + Kali.

    ## Компоненты
    - Kali Linux (VirtualBox) — атакующая машина
    - Metasploitable 2 — уязвимая цель (host-only, без интернета)
    - OWASP Juice Shop (Docker) — веб-цель на localhost

    ## Сеть
    - Host-only: 192.168.56.0/24
    - Kali: 192.168.56.x (host-only) + NAT
    - Metasploitable: 192.168.56.y (только host-only)

    ## Как поднять
    1. ...
    2. ...

    ## Проверка изоляции
    - `ping` цели с Kali → 0% loss
    - `ping 8.8.8.8` с цели → недоступно

- id: linux-inspector
  title: Linux System Inspector
  module: 2
  summary: Скрипт, собирающий срез состояния Linux-системы для аудита.
  description: |
    Инструмент, который одним запуском собирает ключевую информацию о системе:
    пользователи, права на важные файлы, открытые порты, запущенные сервисы.
    Основа для понимания, что вообще происходит на машине.
  requirements:
    - Собрать сведения о пользователях и группах.
    - Найти файлы с подозрительными правами.
    - Показать слушающие порты и сервисы.
  skills:
    - linux
    - bash
  prerequisites:
    - Модуль 2 пройден.
  tasks: []
  expectedResult: Bash- или Python-скрипт с читаемым отчётом о состоянии системы.
  checklist:
    - Скрипт запускается без ошибок на Kali.
    - Вывод структурирован и понятен.
  readmeTemplate: ""

- id: log-analyzer
  title: Security Log Analyzer
  module: 12
  summary: Python-парсер auth.log, выделяющий признаки атак.
  description: |
    Скрипт читает системные логи аутентификации, находит всплески неудачных входов,
    подозрительные IP и формирует краткий отчёт. Первый настоящий defensive-инструмент.
  requirements:
    - Парсить auth.log.
    - Считать неудачные попытки входа по IP.
    - Формировать отчёт с топом подозрительных адресов.
  skills:
    - python
    - log-analysis
    - automation
  prerequisites:
    - Модули 5 и 11 пройдены.
  tasks: []
  expectedResult: Python-скрипт, принимающий путь к логу и выводящий отчёт об аномалиях.
  checklist:
    - Корректно считает неудачные входы.
    - Обрабатывает отсутствие файла и пустой ввод.
  readmeTemplate: ""

- id: file-integrity-monitor
  title: File Integrity Monitor
  module: 14
  summary: Инструмент, отслеживающий несанкционированное изменение файлов по хешам.
  description: |
    Скрипт сохраняет хеши важных файлов и при повторном запуске сообщает, что изменилось.
    Базовая идея, лежащая в основе HIDS и защитного мониторинга.
  requirements:
    - Считать и сохранять хеши набора файлов.
    - Сравнивать текущее состояние с базой.
    - Сообщать о добавленных, изменённых и удалённых файлах.
  skills:
    - python
    - automation
    - crypto
  prerequisites:
    - Модуль 11 пройден.
  tasks: []
  expectedResult: Python-скрипт с командами init/check и понятным отчётом об изменениях.
  checklist:
    - Хеши сохраняются и корректно сравниваются.
    - Изменения файлов надёжно обнаруживаются.
  readmeTemplate: ""

- id: port-scanner
  title: Port Scanner
  module: 13
  summary: Собственный сканер портов на сокетах Python.
  description: |
    Свой мини-Nmap: скрипт проверяет диапазон портов на цели в лаборатории и снимает баннеры.
    Помогает понять, как сканеры работают изнутри, а не только как ими пользоваться.
  requirements:
    - Проверять диапазон TCP-портов на заданном host.
    - Определять открытые порты.
    - Снимать баннеры сервисов, где возможно.
  skills:
    - python
    - networking
    - automation
  prerequisites:
    - Модули 3 и 11 пройдены.
  tasks: []
  expectedResult: Python-скрипт, сканирующий цель в host-only сети и выводящий открытые порты.
  checklist:
    - Работает только по целям в своей лаборатории.
    - Обрабатывает таймауты и закрытые порты.
  readmeTemplate: ""
