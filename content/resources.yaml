- category: Linux и терминал
  items:
    - title: Linux Journey
      url: https://linuxjourney.com/
      note: Пошаговый интерактивный курс по Linux с нуля.
      lang: EN
    - title: Kali Linux Documentation
      url: https://www.kali.org/docs/
      note: "Официальная документация Kali: установка, инструменты, настройка."
      lang: EN

