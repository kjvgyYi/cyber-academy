      url: https://owasp.org/www-project-juice-shop/
      note: Намеренно уязвимое веб-приложение для практики web security.
      lang: EN

- category: Web Security
  items:
    - title: OWASP Top 10
      url: https://owasp.org/www-project-top-ten/
