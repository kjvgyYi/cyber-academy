  items:
    - title: StGB §202a — Ausspähen von Daten
      url: https://www.gesetze-im-internet.de/stgb/__202a.html
      note: Первоисточник по несанкционированному доступу к данным.
      lang: DE
    - title: StGB §202c — Vorbereiten des Ausspähens
      url: https://www.gesetze-im-internet.de/stgb/__202c.html
      note: Про подготовку и «хакерские инструменты».
